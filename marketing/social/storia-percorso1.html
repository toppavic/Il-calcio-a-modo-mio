<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Storia Percorso 1</title>
<style>
@font-face { font-family: Oswald; src: url(../../prodotti/gli-imbattibili/font/oswald.woff2); font-weight: 200 700; }
@font-face { font-family: Inter; src: url(../../prodotti/gli-imbattibili/font/inter.woff2); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #222; font-family: Inter, sans-serif; }
.slide { width: 1080px; height: 1920px; position: relative; overflow: hidden; color: #fff;
  background: radial-gradient(ellipse at 30% 30%, #173556 0%, #0e2440 45%, #08162a 100%); }
.logo { position: absolute; top: 190px; left: 50%; transform: translateX(-50%); width: 420px; -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 100%); }
.txt { position: absolute; left: 80px; right: 80px; top: 720px; text-align: left; }
.kick { font-family: Oswald; letter-spacing: .22em; text-transform: uppercase; color: #d4a017; font-size: 34px; font-weight: 500; }
h1 { font-family: Oswald; text-transform: uppercase; font-weight: 700; line-height: .98; font-size: 128px; margin: 26px 0 34px; }
h1 span { color: #d4a017; display: block; }
p { font-size: 44px; line-height: 1.35; color: #dbe4ee; }
p b { color: #fff; }
.badge { display: inline-block; margin-top: 44px; background: #d4a017; color: #0e2440; font-family: Oswald; font-weight: 700; font-size: 40px; text-transform: uppercase; letter-spacing: .05em; padding: 14px 30px; border-radius: 12px; }
</style></head><body>
<section class="slide">
  <img class="logo" src="../../materiale/brand/logo-cerchio.png">
  <div class="txt">
    <div class="kick">Dai quaderni del mister · Percorso 1</div>
    <h1>La ricerca<span>del portiere</span></h1>
    <p><b>7 tappe</b> per insegnare alla squadra a <b>pressare insieme</b>.</p>
    <p style="margin-top:26px">Se corri solo tu, hai già perso.</p>
    <span class="badge">Ora su Etsy · PDF</span>
  </div>
</section>
</body></html>
