<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Storia regalo</title><style>
@font-face { font-family: Oswald; src: url(../../prodotti/gli-imbattibili/font/oswald.woff2) format("woff2"); font-weight: 200 700; }
@font-face { font-family: Inter; src: url(../../prodotti/gli-imbattibili/font/inter.woff2) format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #888; }
.slide.storia { width: 1080px; height: 1920px; background: #f3efe4; color: #0f3d2e; position: relative; overflow: hidden; font-family: Inter, sans-serif; text-align: center; }
.storia .bg { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: grayscale(1); opacity: .10; transform: rotate(-4deg) scale(1.1); }
.logo { position: absolute; top: 230px; left: 50%; transform: translateX(-50%); width: 520px; -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 100%); }
.txt { position: absolute; left: 80px; right: 80px; top: 800px; }
.kick { font-family: Oswald, sans-serif; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; font-size: 34px; color: #b8860b; }
h1 { font-family: Oswald, sans-serif; font-weight: 700; text-transform: uppercase; font-size: 124px; line-height: .95; margin: 24px 0 36px; white-space: nowrap; }
h1 span { color: #b8860b; display: block; }
.sub { font-size: 48px; line-height: 1.35; }
.btn { display: inline-block; margin-top: 56px; padding: 30px 56px; border-radius: 18px; background: #0f3d2e; color: #fff; font-family: Oswald, sans-serif; text-transform: uppercase; letter-spacing: .08em; font-size: 56px; }
.btn b { color: #d4a017; font-weight: 700; }
</style></head><body>
<section class="slide storia">
<img class="bg" src="../../materiale/precampionato/allenamento-01.jpg">
<img class="logo" src="../../materiale/brand/logo-cerchio.png">
<div class="txt">
<div class="kick">Gli Imbattibili</div>
<h1>Allenamento 1<span>gratis</span></h1>
<p class="sub">Con gli schemi e il programma della seduta completa.</p>
<div class="btn">Scrivimi <b>PRECAMPIONATO</b></div>
</div>
</section></body></html>
